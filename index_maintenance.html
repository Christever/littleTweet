<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MyLittleTweet - Maintenance</title>

    <style>
      * {
          box-sizing: border-box;
      }

      body {
          margin: 0;
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: Arial, Helvetica, sans-serif;
          background: #020617;
          color: #e2e8f0;
      }

      .container {
          text-align: center;
          max-width: 600px;
          padding: 40px;
      }

      .logo {
          font-size: 4rem;
          margin-bottom: 20px;
      }

      h1 {
          color: #2dd4bf;
          font-size: 2.2rem;
          margin-bottom: 15px;
      }

      p {
          font-size: 1.1rem;
          line-height: 1.6;
          color: #94a3b8;
      }

      .card {
          margin-top: 30px;
          padding: 25px;
          border-radius: 16px;
          background: #0f172a;
          border: 1px solid #1e293b;
      }

      .loader {
          margin: 25px auto 0;
          width: 45px;
          height: 45px;
          border: 4px solid #1e293b;
          border-top-color: #14b8a6;
          border-radius: 50%;
          animation: spin 1s linear infinite;
      }

      footer {
          margin-top: 35px;
          font-size: 0.85rem;
          color: #64748b;
      }

      @keyframes spin {
          to {
              transform: rotate(360deg);
          }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="logo">🐦</div>

      <h1>MyLittleTweet est momentanément indisponible</h1>

      <div class="card">
        <p>Une opération de maintenance est actuellement en cours.</p>

        <p>
          Nous effectuons quelques améliorations afin de vous proposer une
          meilleure expérience.
        </p>

        <div class="loader"></div>
      </div>

      <footer>Merci de votre patience 💙</footer>
    </div>
  </body>
</html>
